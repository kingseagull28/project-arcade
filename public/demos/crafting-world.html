<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Crafting World demo</title><style>body{font:20px system-ui;background:#365314;color:white;text-align:center;padding:10vh 20px}button{font:inherit;padding:18px;border:0;border-radius:12px;margin:10px;cursor:pointer}a{color:white}</style><h1>Crafting World</h1><p>Bundled click-to-score sample · reach 10 points</p><p id="score" aria-live="polite">0 / 10</p><button id="go">Craft a block</button><button id="reset">Restart</button><p><a href="/">Back to collection</a></p><script>let n=0;const s=document.querySelector('#score'),g=document.querySelector('#go');g.onclick=()=>{n++;s.textContent=n===10?'You won!':n+' / 10';g.disabled=n===10};document.querySelector('#reset').onclick=()=>{n=0;s.textContent='0 / 10';g.disabled=false};</script></html>
